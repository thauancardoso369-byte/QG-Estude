<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QG ESTUDE - Preparatório PMESP e GCM-SP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            dark: '#0B0F19',
                            card: '#111827',
                            accent: '#2563EB',
                            hover: '#1D4ED8',
                            success: '#10B981',
                            warning: '#F59E0B'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-dark text-gray-100 min-h-screen flex flex-col font-sans">

    <!-- HEADER / NAVBAR -->
    <header class="bg-brand-card border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg font-bold">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg tracking-wider text-white">QG ESTUDE</h1>
                    <p class="text-xs text-gray-400">Preparatório PMESP & GCM-SP</p>
                </div>
            </div>

            <div class="flex items-center space-x-4">
                <div id="userInfoHeader" class="hidden items-center space-x-2 bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700">
                    <span id="displayUserNickname" class="text-sm font-medium text-blue-400"></span>
                    <button onclick="fazerLogout()" class="text-xs text-red-400 hover:text-red-300 ml-2" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
                <!-- Botão Área ADM -->
                <button onclick="abrirModalAdmin()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3 py-1.5 rounded-lg text-sm border border-gray-700 flex items-center space-x-2 transition">
                    <i class="fa-solid fa-lock text-yellow-500"></i>
                    <span>Área ADM</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-6 flex flex-col">

        <!-- TELA 1: IDENTIFICAÇÃO DO ALUNO -->
        <div id="viewAlunoLogin" class="max-w-md mx-auto w-full bg-brand-card p-8 rounded-2xl border border-gray-800 shadow-xl my-auto">
            <div class="text-center mb-6">
                <div class="inline-flex bg-blue-600/10 text-blue-500 p-4 rounded-full text-3xl mb-3">
                    <i class="fa-solid fa-user-graduate"></i>
                </div>
                <h2 class="text-2xl font-bold text-white">Bem-vindo ao QG Estude</h2>
                <p class="text-gray-400 text-sm mt-1">Insira seu apelido para acessar os simulados e acompanhar seu progresso.</p>
            </div>

            <form id="formAlunoLogin" onsubmit="entrarComoAluno(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 uppercase mb-2">Seu Apelido / Nome</label>
                    <input type="text" id="inputNickname" required placeholder="Ex: Guerreiro_PM" 
                        class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-600 transition">
                </div>
